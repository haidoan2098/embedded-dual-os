# Multiconfig "domu1": cấu hình build của domain domU1.
#
# domU1 chạy kernel Linux 6.6 thường (PREEMPT) với rootfs dualos-domu1-image.
#
# Mỗi domU là một multiconfig riêng để có kernel, rootfs và thư mục deploy riêng,
# mà vẫn build được trong cùng một build dir. Config mặc định (local.conf) chỉ lo
# Xen và DTB; hai config domu1/domu2 được bật bằng BBMULTICONFIG trong local.conf.
#
# Dùng:
#   bitbake mc:domu1:dualos-domu1-image
# Kết quả (Image và rootfs cpio.gz) nằm trong
#   ${TOPDIR}/tmp-mc-domu1/deploy/images/qemuarm64/

# Cùng phần cứng và distro với config mặc định. Đặt tường minh để config này
# không đổi theo local.conf.
MACHINE = "qemuarm64"
DISTRO = "poky"

# Kernel của domain này. "virtual/kernel" là nhãn mà các recipe dùng để chọn kernel,
# và mỗi config chỉ có một provider, nên hai domain khác kernel phải ở hai config.
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"

# Mỗi config một TMPDIR. Tên file Image trong deploy dir không chứa tên recipe
# (symlink "Image" dùng chung một tên), nên hai kernel cùng MACHINE ghi vào cùng
# thư mục sẽ đè nhau. TMPDIR riêng cũng giữ output của domU1 tách khỏi Xen.
# Đường dẫn này được recipe dualos-dom0less-dtb dùng lại (DOMU1_DEPLOY): đổi ở
# đây thì phải đổi ở đó.
TMPDIR = "${TOPDIR}/tmp-mc-domu1"
