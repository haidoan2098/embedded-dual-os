# domU1: kernel linux-yocto 6.6.
# Build: bitbake mc:domu1:dualos-domu1-image
# Kết quả: ${TOPDIR}/tmp-mc-domu1/deploy/images/qemuarm64/

MACHINE = "qemuarm64"
DISTRO = "poky"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"

# TMPDIR riêng: tên file Image trong deploy dir không chứa tên recipe, hai kernel
# cùng MACHINE sẽ đè nhau. Đường dẫn này được dualos-dom0less-dtb.bb dùng lại.
TMPDIR = "${TOPDIR}/tmp-mc-domu1"
