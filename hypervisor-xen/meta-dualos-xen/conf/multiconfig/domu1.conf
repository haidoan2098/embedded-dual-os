# Multiconfig "domu1": cấu hình build cho OS của domU1.
#
# Config mặc định (local.conf) chỉ lo Xen và phần chung. Mỗi domU một config
# riêng (domu1, domu2) để hai OS đối xứng và tách được cấu hình về sau.
#
# Gọi: bitbake mc:domu1:dualos-domu1-image
#
# Tham khảo: poky meta/lib/oeqa/selftest/cases/multiconfig.py

MACHINE = "qemuarm64"
DISTRO = "poky"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"

# TMPDIR riêng để deploy dir của domU1 không trộn với Xen (config mặc định)
# và với domU2 (cùng MACHINE, symlink "Image" sẽ đè nhau)
TMPDIR = "${TOPDIR}/tmp-mc-domu1"
