# domU2: kernel linux-yocto-rt 6.6 (PREEMPT_RT).
# Build: bitbake mc:domu2:dualos-domu2-image
# Kết quả: ${TOPDIR}/tmp-mc-domu2/deploy/images/qemuarm64/

MACHINE = "qemuarm64"
DISTRO = "poky"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-rt"
PREFERRED_VERSION_linux-yocto-rt = "6.6%"

# TMPDIR riêng, lý do như domu1.conf. Đường dẫn này được dualos-dom0less-dtb.bb dùng lại.
TMPDIR = "${TOPDIR}/tmp-mc-domu2"
