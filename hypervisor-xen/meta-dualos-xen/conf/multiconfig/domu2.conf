# Multiconfig "domu2": cấu hình build cho OS của domU2.
#
# Config mặc định (local.conf) build Xen + domU1 với kernel linux-yocto 6.6.
# Config này build domU2 với kernel 6.6-rt, trên cùng phần cứng.
#
# Gọi: bitbake mc:domu2:dualos-domu2-image
#
# Tham khảo: poky meta/lib/oeqa/selftest/cases/multiconfig.py (đặt MACHINE,
# DISTRO, TMPDIR tường minh), meta-virtualization conf/multiconfig/container.conf.

MACHINE = "qemuarm64"
DISTRO = "poky"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-rt"
PREFERRED_VERSION_linux-yocto-rt = "6.6%"

# Cùng MACHINE với config mặc định nên phải tách TMPDIR: tên file deploy của
# kernel không chứa tên recipe, symlink "Image" của hai kernel sẽ đè nhau.
TMPDIR = "${TOPDIR}/tmp-mc-domu2"
