# Multiconfig "domu2": cấu hình build của domain domU2.
#
# domU2 chạy kernel Linux 6.6-rt (PREEMPT_RT) với rootfs dualos-domu2-image.
# Các lý do tổ chức theo multiconfig giống domu1.conf.
#
# Dùng:
#   bitbake mc:domu2:dualos-domu2-image
# Kết quả (Image và rootfs cpio.gz) nằm trong
#   ${TOPDIR}/tmp-mc-domu2/deploy/images/qemuarm64/

# Cùng phần cứng và distro với config mặc định. Đặt tường minh để config này
# không đổi theo local.conf.
MACHINE = "qemuarm64"
DISTRO = "poky"

# Kernel của domain này: bản PREEMPT_RT (recipe linux-yocto-rt của poky) thay cho
# linux-yocto. Fragment Xen của meta-virtualization vẫn được áp vì recipe này
# cùng LINUX_VERSION 6.6 và có kmeta.
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-rt"
PREFERRED_VERSION_linux-yocto-rt = "6.6%"

# Mỗi config một TMPDIR, vì tên file Image trong deploy dir không chứa tên recipe
# nên hai kernel cùng MACHINE sẽ đè nhau (xem domu1.conf).
# Đường dẫn này được recipe dualos-dom0less-dtb dùng lại (DOMU2_DEPLOY): đổi ở
# đây thì phải đổi ở đó.
TMPDIR = "${TOPDIR}/tmp-mc-domu2"
