# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-dualos-xen"
BBFILE_PATTERN_meta-dualos-xen = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-dualos-xen = "6"

LAYERDEPENDS_meta-dualos-xen = "core"
LAYERSERIES_COMPAT_meta-dualos-xen = "scarthgap"

# Layer chưa có recipe nào; bỏ dòng này khi đã có recipe/bbappend
BBFILE_PATTERN_IGNORE_EMPTY_meta-dualos-xen = "1"
